# jobhunt configuration — India-First, Open Platform
#
# This config is the DEFAULT base. Users override everything through their
# profile & preferences in the web UI. No editing Python needed.
#
# Philosophy: Cast the widest possible net. Let the LLM scorer (0–10) decide
# what fits the user — not hard-coded regex exclusions.

filters:
  # include_titles: Focus on software engineering, tech, and developer roles.
  # Users override this dynamically through their web UI Profile Settings.
  include_titles:
    - 'software engineer'
    - 'software engineering'
    - '\b(se|sde|swe)\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'
    - 'associate software engineer'
    - 'junior software engineer'
    - 'graduate engineer'
    - 'engineer intern'
    - 'developer intern'
    - 'software intern'
    - 'engineering intern'
    - '\bintern\b'
    - '\b(backend|back-end|server|platform|api)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|api)\b'
    - 'full.?stack engineer'
    - 'full.?stack developer'
    - 'frontend engineer'
    - 'frontend developer'
    - 'web developer'
    - 'web engineer'
    - '\b(node(\.js)?|python|javascript|typescript|react|next(\.js)?)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(node(\.js)?|python|javascript|typescript|react|next(\.js)?)\b'
    - '\b(ai|ml|llm|genai|generative)\b.*\bengineer\b'
    - '\bengineer\b.*\b(ai|llm|genai|generative)\b'
    - 'ai application(s)? engineer'
    - 'ai software engineer'

  # exclude_titles: Drop non-tech, executive, and extreme seniority noise
  exclude_titles:
    - '\b(ceo|coo|cfo|cto|ciso|vp|svp|evp|c-suite)\b'
    - '\b(director|vice president|head of|chief)\b'
    - '\b(manager|management|lead)\b'
    - '\b(sales|account executive|marketing|recruit|talent.*acquisition|hr.*intern)\b'
    - '\b(ios|android|game|designer|ux|ui)\b'

  # locations: Leave empty = accept ALL locations worldwide (India + Remote + Global).
  # Users set their preferred cities/regions in the Profile Settings wizard.
  # To restrict globally, add Indian cities or 'remote' here.
  locations: []

  # allow_remote: true = remote jobs always pass the location gate.
  allow_remote: true

  # job_types: Accept all employment types by default.
  # Users can restrict via profile: [fulltime, internship, contract, parttime, remote, hybrid, onsite]
  job_types: []

  # max_age_days: Accept jobs posted in the last 21 days.
  max_age_days: 21

# --- LLM scoring & concurrency -------------------------------------------
screen_batch_size: 8        # 8 jobs/call — optimal batch payload for Gemini Flash
screen_jd_chars: 1000       # Precise context truncation for evaluation
draft_jd_chars: 6000        # Full context for kit drafting
score_threshold: 7.0        # High bar: 7.0 drafts kits only for strong matches
max_per_digest: 7           # Hard cap on drafted kits per run
max_jobs_to_screen: 30      # Max unseen jobs evaluated per run to protect rate limits

# Concurrency & rate-limit tuning
fetch_max_workers: 16       # Parallel HTTP requests across ATS company boards
llm_max_workers: 1          # Sequential processing to strictly prevent rate limit bursts
llm_delay_seconds: 4.0      # Exactly 4.0s delay = 15 RPM (matches Gemini 15 RPM free tier ceiling)

# --- paths ----------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: state/seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv

# --- regional context (injected into LLM screening prompts) ---------------
# Options: india | global | us | uk | eu
# Set to 'global' to remove India-specific salary/city hints from LLM prompts.
# Existing users: keep 'india' — this preserves all existing behaviour exactly.
region_context: india
region_hint: "India-first platform. Consider Indian salary norms (LPA), Indian cities and companies. If a job mentions Indian cities or 'remote' it is highly relevant for Indian candidates."

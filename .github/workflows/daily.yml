name: Daily Career Intelligence Digest
run-name: 🏹 Daily Job Hunter Automated Radar (${{ github.event_name }})

on:
  schedule:
    # 23:30 UTC = 05:00 IST (Every Single Day, Monday through Sunday)
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode: single (Primary Account) or multi (All Supabase Users)'
        required: true
        default: 'multi'
        type: choice
        options:
          - multi
          - single
          - mock

permissions:
  contents: write

jobs:
  hunt:
    name: Execute Job Hunter Radar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --default-timeout=120 --retries 5 -e .

      - name: Restore Deduplication Caches
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            seen_*.json
            state/
            out/
          key: jobhunt-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobhunt-cache-${{ runner.os }}-
            jobhunt-cache-

      - name: Execute Autonomous Job Hunter Radar
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
          SCREEN_MODEL: "gemini-3.7-flash"
          DRAFT_MODEL: "gemini-3.7-flash"
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_REQUIRED: "false"
          CI: "true"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "mock" ]; then
            echo "Running mock dry run..."
            python -u -m jobhunt run --mock --scorer keyword
          elif [ -n "${{ secrets.SUPABASE_URL }}" ] && [ "${{ github.event.inputs.mode }}" != "single" ]; then
            echo "Running Centralized Multi-User Batch Pipeline..."
            python -u -m jobhunt multi-run --send
          else
            echo "Running Single-User Pipeline..."
            python -u -m jobhunt run --send
          fi

      - name: Save Digest Briefing Artifact (Single-User Mode)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-digest-briefing
          path: |
            out/digest.html
            out/tracker.csv
          if-no-files-found: ignore
          retention-days: 7

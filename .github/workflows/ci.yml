name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy jobhunt

      - name: Run pytest suite with coverage
        run: |
          pytest --cov=jobhunt --cov-report=term-missing --cov-fail-under=90 tests/

      - name: Verify CLI offline dry run
        run: |
          python -m jobhunt run --mock --scorer keyword

      - name: Verify master automation script dry run
        env:
          CI: "true"
        run: |
          python -c "import argparse; from jobhunt import cli; cli.cmd_run(argparse.Namespace(config=None, mock=True, send=False, scorer='keyword'))"


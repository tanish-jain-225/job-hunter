<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bgBanner)"/>
  <rect width="1198" height="278" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Decorative Glow Background Orbs -->
  <circle cx="100" cy="140" r="80" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1100" cy="80" r="100" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>

  <!-- Brand Mark Icon Circle -->
  <g transform="translate(60, 65)">
    <circle cx="75" cy="75" r="70" fill="url(#glowCircle)" filter="url(#glow)"/>
    <circle cx="75" cy="75" r="62" fill="#0f172a"/>
    <!-- Crosshair Target Radar Icon -->
    <circle cx="75" cy="75" r="45" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="75" cy="75" r="28" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="75" cy="75" r="10" fill="#38bdf8"/>
    <line x1="75" y1="20" x2="75" y2="130" stroke="#6366f1" stroke-width="2"/>
    <line x1="20" y1="75" x2="130" y2="75" stroke="#6366f1" stroke-width="2"/>
    <!-- Radar pulse beam -->
    <polygon points="75,75 110,40 120,60" fill="#38bdf8" opacity="0.35"/>
  </g>

  <!-- Main Title & Tagline -->
  <g transform="translate(240, 95)">
    <text x="0" y="32" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5">JOB HUNTER</text>
    <text x="0" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Autonomous AI-Powered Career Intelligence &amp; Job Radar</text>
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Scouts 9 ATS Platforms • $0 Deterministic Filtering • Gemini 3.5 Flash Intelligence • Interactive Web Board</text>
  </g>

  <!-- Metric Badges on Right -->
  <g transform="translate(920, 45)">
    <!-- Badge 1: 9 ATS Engines -->
    <g transform="translate(0, 0)">
      <rect width="220" height="42" rx="8" fill="url(#pillGrad)" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="10" fill="#1e3a8a"/>
      <text x="22" y="25" fill="#60a5fa" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">ATS</text>
      <text x="42" y="19" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">SCOUTING ENGINE</text>
      <text x="42" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">9 Major ATS Platforms</text>
    </g>

    <!-- Badge 2: AI Engine -->
    <g transform="translate(0, 50)">
      <rect width="220" height="42" rx="8" fill="url(#pillGrad)" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="10" fill="#312e81"/>
      <text x="22" y="25" fill="#a5b4fc" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">AI</text>
      <text x="42" y="19" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">INTELLIGENCE MODEL</text>
      <text x="42" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Gemini 3.5 Flash (1M TPD)</text>
    </g>

    <!-- Badge 3: 395 Tests -->
    <g transform="translate(0, 100)">
      <rect width="220" height="42" rx="8" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="10" fill="#064e3b"/>
      <text x="22" y="25" fill="#34d399" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">✓</text>
      <text x="42" y="19" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">TEST SUITE COVERAGE</text>
      <text x="42" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">395 Passed (100%)</text>
    </g>

    <!-- Badge 4: Free Forever -->
    <g transform="translate(0, 150)">
      <rect width="220" height="42" rx="8" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="10" fill="#78350f"/>
      <text x="22" y="25" fill="#fbbf24" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">$</text>
      <text x="42" y="19" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">OPERATIONAL EXPENSE</text>
      <text x="42" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">$0.00 / Month (Free Tier)</text>
    </g>
  </g>
</svg>
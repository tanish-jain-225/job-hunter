    <rect x="460" y="95" width="185" height="190" rx="12" fill="url(#cardGrad1)" stroke="#6366f1" stroke-width="1.6"/>
    <rect x="472" y="107" width="32" height="32" rx="8" fill="url(#brandGrad)"/>
    <text x="488" y="128" fill="#ffffff" font-family="sans-serif" font-size="15" text-anchor="middle">⚡</text>
    <text x="514" y="122" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PHASE 3</text>
    <text x="514" y="137" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">AI Screening</text>
    <text x="472" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Google Gemini 3.5 Flash</text>
    <text x="472" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• 8 Jobs Batch Payload</text>
    <text x="472" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Multi-Key CSV Rotation</text>
    <text x="472" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• 15 RPM Leaky Bucket</text>
    <rect x="472" y="248" width="161" height="24" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
    <text x="552" y="264" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Scores 0.0 - 10.0</text>

  <!-- Card 5: Deliver -->
  <g filter="url(#shadow)">
    <rect x="880" y="95" width="180" height="190" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="892" y="107" width="32" height="32" rx="8" fill="url(#purpleGrad)"/>
    <text x="908" y="128" fill="#ffffff" font-family="sans-serif" font-size="15" text-anchor="middle">📬</text>
    <text x="934" y="122" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PHASE 5</text>
    <text x="934" y="137" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Dual Delivery</text>
    <text x="892" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Web Board (Pagination)</text>
    <text x="892" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• 5-Stage Dropdowns</text>
    <text x="892" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Morning HTML Email</text>
    <text x="892" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Pure Flexbox (300px+)</text>
    <rect x="892" y="248" width="156" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="970" y="264" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Human Presses Submit</text>

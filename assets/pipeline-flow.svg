  </defs>

  <rect width="1100" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1098" height="318" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">⚡ Autonomous Career Intelligence Radar — Execution Funnel</text>
  <text x="40" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Single-pass multi-tenant architecture • Zero token waste • $0.00 / month operational cost</text>

  <g stroke="#475569" stroke-width="2" stroke-dasharray="4 4">
    <line x1="225" y1="180" x2="250" y2="180"/>
    <line x1="435" y1="180" x2="460" y2="180"/>
    <line x1="645" y1="180" x2="670" y2="180"/>
    <line x1="855" y1="180" x2="880" y2="180"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="248,176 254,180 248,184"/>
    <polygon points="458,176 464,180 458,184"/>
    <polygon points="668,176 674,180 668,184"/>
    <polygon points="878,176 884,180 878,184"/>
  </g>

  <!-- Card 1: Scout -->
  <g filter="url(#shadow)">
    <rect x="40" y="95" width="185" height="190" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="52" y="107" width="32" height="32" rx="8" fill="url(#blueGrad)"/>
    <text x="68" y="128" fill="#ffffff" font-family="sans-serif" font-size="15" text-anchor="middle">📡</text>
    <text x="94" y="122" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PHASE 1</text>
    <text x="94" y="137" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">ATS Scouting</text>
    <text x="52" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• 9 Public ATS APIs</text>
    <text x="52" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Greenhouse, Lever, Ashby</text>
    <text x="52" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• SmartRecruiters, etc.</text>
    <text x="52" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• + Add Board Detection</text>
    <rect x="52" y="248" width="161" height="24" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="132" y="264" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">~2,000 Postings / Pass</text>
  </g>

  <!-- Card 2: Prefilter -->
  <g filter="url(#shadow)">
    <rect x="250" y="95" width="185" height="190" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="262" y="107" width="32" height="32" rx="8" fill="url(#emeraldGrad)"/>
    <text x="278" y="128" fill="#ffffff" font-family="sans-serif" font-size="15" text-anchor="middle">🎯</text>
    <text x="304" y="122" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PHASE 2</text>
    <text x="304" y="137" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Stealth Filter</text>
    <text x="262" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Safe Regex Matchers</text>
    <text x="262" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Location &amp; Remote Gate</text>
    <text x="262" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Freshness Window (21d)</text>
    <text x="262" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• $0 Token Spend Gate</text>
    <rect x="262" y="248" width="161" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="342" y="264" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">98% Noise Dropped</text>
  </g>


  <!-- Card 4: Draft -->
  <g filter="url(#shadow)">
    <rect x="670" y="95" width="185" height="190" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2"/>
    <rect x="682" y="107" width="32" height="32" rx="8" fill="url(#amberGrad)"/>
    <text x="698" y="128" fill="#ffffff" font-family="sans-serif" font-size="15" text-anchor="middle">🧠</text>
    <text x="724" y="122" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PHASE 4</text>
    <text x="724" y="137" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Kit Drafting</text>
    <text x="682" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Tailored Cover Letters</text>
    <text x="682" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• 80-word Cold Outreaches</text>
    <text x="682" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Matching Resume Bullets</text>
    <text x="682" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Smart Follow-up Nudges</text>
    <rect x="682" y="248" width="161" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="762" y="264" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Top Matches (Score ≥ 7.0)</text>

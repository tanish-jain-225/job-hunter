# jobhunt configuration example. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  include_titles:
    # Core engineering titles & internships
    - 'software engineer'
    - 'software engineering'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'
    - 'associate software engineer'
    - 'junior software engineer'
    - 'graduate engineer'
    - 'engineer intern'
    - 'developer intern'
    - 'software intern'
    - 'engineering intern'
    - '\bintern\b'

    # Backend / API / Full-Stack / Web / Frontend variants
    - '\b(backend|back-end|server|platform|api)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|api)\b'
    - 'full.?stack engineer'
    - 'full.?stack developer'
    - 'frontend engineer'
    - 'frontend developer'
    - 'web developer'
    - 'web engineer'

    # Node.js / Python / JavaScript / TypeScript / React / Next.js specific
    - '\b(node(\.js)?|python|javascript|typescript|react|next(\.js)?)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(node(\.js)?|python|javascript|typescript|react|next(\.js)?)\b'

    # AI/ML engineering (integrations/applications)
    - '\b(ai|ml|llm|genai|generative)\b.*\bengineer\b'
    - '\bengineer\b.*\b(ai|llm|genai|generative)\b'
    - 'ai application(s)? engineer'
    - 'ai software engineer'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'   # too senior
    - '\bsenior\b'                                             # too senior (< 2 YoE)
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management|lead)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(ios|android|mobile|game|designer|design|ux|ui)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(devops|devsecops)\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane|dpdk)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - india
    - mumbai
    - bengaluru
    - bangalore
    - pune
    - thane
    - hyderabad
    - gurugram
    - gurgaon
    - delhi
    - chennai
    - noida
    - ahmedabad
    - surat

  # Optional: Exclude specific restricted locations even if allow_remote is true
  # exclude_locations:
  #   - '\b(united states|usa|us only)\b'
  #   - '\b(europe|eu only|uk only)\b'

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to 28 days for fresh weekly/daily runs.
  max_age_days: 28

# --- LLM stages & concurrency -----------------------------------------------
screen_batch_size: 10     # 10 jobs/call ≈ 4300 tokens — safely under Groq 8000 TPM cap
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 8000      # JD truncation for drafting
score_threshold: 6.0      # score bar: catches genuine matches while dropping poor fits
max_per_digest: 10        # hard cap on drafted kits per run

# Concurrency & rate-limit tuning
# 800 jobs → 80 batches × 1.5s = 2 min delay (vs old 161 batches × 3.5s = 9.4 min)
fetch_max_workers: 12     # parallel HTTP requests across ATS boards
llm_max_workers: 1        # sequential batch workers to prevent rate limit spikes
llm_delay_seconds: 1.5    # 1.5s between calls is plenty at 4300 tokens/call

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: state/seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv

# --- regional context (injected into LLM screening prompts) ----------------
# Options: india | global | us | uk | eu
# Set to 'global' to remove India-specific salary / city hints from LLM prompts.
# Leaving 'india' preserves all default behavior for Indian job seekers.
region_context: india
region_hint: "India-first platform. Consider Indian salary norms (LPA), Indian cities and companies. If a job mentions Indian cities or 'remote' it is highly relevant for Indian candidates."

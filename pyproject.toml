[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "1.0.0"
description = "A personal job-search agent that finds, filters, ranks, and drafts application kits from public ATS boards."
readme = "README.md"
authors = [
    { name = "Tanish Sanghvi" }
]
license = "MIT"
requires-python = ">=3.9"
keywords = ["job-search", "career-agent", "ats", "llm", "automation", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "anthropic>=0.40.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "ruff>=0.2.0",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[project.urls]
Homepage = "https://github.com/tanish-jain-225/job-hunter"
Repository = "https://github.com/tanish-jain-225/job-hunter.git"
Issues = "https://github.com/tanish-jain-225/job-hunter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobhunt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E731", "E741"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["jobhunt"]
omit = ["jobhunt/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
show_missing = true



